
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OW Team Tracker V2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: { colors: { ow: { orange: "#f99e1a", ink: "#0b0e14", panel: "#141821" } } }
        }
      };
    </script>
</head>
<body class="min-h-screen bg-ow-ink text-slate-100 antialiased font-sans">
    <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(249,158,26,0.1),_transparent_60%)]"></div>

    <main class="relative mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      
      <!-- Header & Controls -->
      <header class="mb-8 flex flex-col sm:flex-row items-start sm:items-end justify-between gap-4 border-b border-white/10 pb-6">
        <div>
          <p class="text-xs font-bold uppercase tracking-[0.25em] text-ow-orange">Overwatch Tracker V2.0</p>
          <h1 class="mt-2 text-3xl font-black tracking-tight sm:text-4xl">数据去水，战力溯源</h1>
        </div>
        <div class="flex items-center gap-3">
          <select id="periodSelect" onchange="loadReport()" class="bg-ow-panel border border-white/20 text-sm rounded-lg px-3 py-2.5 text-white outline-none focus:border-ow-orange">
            <option value="1">昨日复盘 (1 天)</option>
            <option value="7" selected>本周战报 (7 天)</option>
            <option value="30">月度总结 (30 天)</option>
          </select>
          <button id="refreshBtn" onclick="forceSync()" class="bg-ow-orange hover:bg-orange-500 text-ow-ink px-4 py-2.5 rounded-lg font-bold text-sm transition-all flex items-center gap-2">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            强制拉取快照
          </button>
        </div>
      </header>

      <!-- Awards Wall -->
      <section class="mb-10">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><span class="text-2xl">🏆</span> 本期“大王”颁奖台</h2>
        <div id="awardsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
            <!-- JS 渲染奖项 -->
        </div>
      </section>

      <!-- Players Grid -->
      <section id="playersGrid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
          <!-- JS 渲染卡片 -->
      </section>

      <!-- Loading State -->
      <div id="loading" class="hidden flex-col items-center justify-center py-20">
        <div class="h-10 w-10 animate-spin rounded-full border-4 border-white/10 border-t-ow-orange"></div>
        <p class="mt-4 text-slate-400 font-medium">引擎分析中...</p>
      </div>

    </main>

    <script>
      function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
      function safeDiv(num, den) { return den > 0 ? num / den : 0; }
      function getPer10(val, time) { return safeDiv(val, time) * 600; }
      function getKDA(elims, assists, deaths) { return safeDiv(elims + assists, deaths > 0 ? deaths : 1); }

      // 奖项图标映射
      const awardIcons = {
          "狗运小子（最佳胜率）": "🍀", "确实是会保活大王": "🛡️", "最爱回家大王": "💀",
          "本周小天使": "👼", "伤害确实是打满了大王": "💥", "真正的团队核心奉献之神": "🤝",
          "传奇刮痧大王": "🔋", "人头狗": "🥷", "真·杀意很大": "🩸",
          "可能真的要等ELO了": "📉", "应该就没在上班": "🎮"
      };

      async function loadReport() {
          const days = document.getElementById("periodSelect").value;
          document.getElementById("playersGrid").innerHTML = "";
          document.getElementById("awardsGrid").innerHTML = "";
          document.getElementById("loading").classList.remove("hidden");
          document.getElementById("loading").classList.add("flex");

          try {
              const res = await fetch(`/api/report/${days}`);
              const data = await res.json();
              renderAwards(data.awards);
              renderPlayers(data.players);
          } catch(e) {
              console.error(e);
              alert("数据加载失败");
          } finally {
              document.getElementById("loading").classList.add("hidden");
              document.getElementById("loading").classList.remove("flex");
          }
      }

      function renderAwards(awards) {
          if (!awards || Object.keys(awards).length === 0) return;
          const container = document.getElementById("awardsGrid");
          for (const [awardName, winner] of Object.entries(awards)) {
              const icon = awardIcons[awardName] || "🏅";
              const isBad = ["最爱回家大王", "可能真的要等ELO了", "传奇刮痧大王"].includes(awardName);
              const colorClass = isBad ? "border-rose-900/50 bg-rose-950/20 text-rose-300" : "border-ow-orange/30 bg-ow-orange/10 text-ow-orange";
              
              container.innerHTML += `
                  <div class="rounded-xl border ${colorClass} p-3 flex flex-col items-center justify-center text-center shadow-lg backdrop-blur-sm">
                      <div class="text-2xl mb-1">${icon}</div>
                      <div class="text-[10px] text-slate-300 font-medium mb-1">${awardName}</div>
                      <div class="text-sm font-black truncate w-full">${winner}</div>
                  </div>
              `;
          }
      }

      function renderPlayers(players) {
          const container = document.getElementById("playersGrid");
          
          players.forEach(p => {
              const username = p.summary.username || p.battle_tag;
              const avatar = p.summary.avatar || "";
              
              if (!p.has_delta) {
                  container.innerHTML += `
                      <div class="rounded-2xl border border-white/5 bg-ow-panel/50 p-6 flex flex-col items-center justify-center text-slate-500 min-h-[300px]">
                          <img src="${avatar}" class="h-16 w-16 rounded-full mb-3 opacity-50 grayscale">
                          <h2 class="text-lg font-bold text-white/50">${username}</h2>
                          <p class="text-xs text-center mt-2">快照数量不足<br>（V2.0 分析需至少跨越一天的两次快照，请明天再来看）</p>
                      </div>
                  `;
                  return;
              }

              const o = p.overall;
              const winRate = (safeDiv(o.wins, o.wins + o.losses) * 100).toFixed(1);
              const kda = getKDA(o.elims, o.assists, o.deaths).toFixed(2);
              const deathsPer10 = getPer10(o.deaths, o.time_played).toFixed(1);

              let heroesHtml = '';
              p.heroes.slice(0, 4).forEach(h => {
                  const hTimeMin = (h.time_played / 60).toFixed(0);
                  const hKda = getKDA(h.elims, h.assists, h.deaths).toFixed(1);
                  const hDmg10 = getPer10(h.damage, h.time_played).toFixed(0);
                  const hHeal10 = getPer10(h.healing, h.time_played).toFixed(0);
                  
                  heroesHtml += `
                      <div class="grid grid-cols-4 gap-2 py-2 border-b border-white/5 text-[11px] items-center">
                          <div class="font-bold text-slate-200 capitalize">${h.hero}</div>
                          <div class="text-slate-400 text-center">${hTimeMin}m</div>
                          <div class="text-ow-orange text-center font-mono">${hKda}</div>
                          <div class="text-slate-400 text-right font-mono">${hDmg10} / ${hHeal10}</div>
                      </div>
                  `;
              });

              container.innerHTML += `
                  <article class="flex flex-col rounded-3xl border border-white/10 bg-ow-panel p-5 shadow-2xl transition hover:border-ow-orange/50">
                      <!-- 头部信息 -->
                      <div class="flex items-center gap-4 mb-5 pb-5 border-b border-white/10">
                          <img src="${avatar}" class="h-14 w-14 rounded-full border-2 border-white/10">
                          <div>
                              <h2 class="text-xl font-black text-white">${username}</h2>
                              <p class="text-xs text-slate-400">近期游玩: ${(o.time_played/3600).toFixed(1)} 小时</p>
                          </div>
                      </div>

                      <!-- 大盘 Delta 数据 -->
                      <div class="grid grid-cols-3 gap-3 mb-6">
                          <div class="bg-white/5 rounded-lg p-3 text-center">
                              <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">近期胜率</p>
                              <p class="text-lg font-black text-white">${winRate}%</p>
                              <p class="text-[10px] text-slate-400 mt-0.5">${o.wins}胜 ${o.losses}负</p>
                          </div>
                          <div class="bg-white/5 rounded-lg p-3 text-center" title="(消灭+助攻)/阵亡。综合贡献黄金指标，3.0以上为优秀。">
                              <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 cursor-help border-b border-dotted border-slate-500 inline-block">真实KDA ❓</p>
                              <p class="text-lg font-black text-ow-orange">${kda}</p>
                          </div>
                          <div class="bg-white/5 rounded-lg p-3 text-center" title="阵亡数/游玩时间(秒)*600。越低越好，活着才有输出，顶级玩家在5.0-6.0。">
                              <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 cursor-help border-b border-dotted border-slate-500 inline-block">阵亡/10m ❓</p>
                              <p class="text-lg font-black text-rose-400">${deathsPer10}</p>
                          </div>
                      </div>

                      <!-- 英雄列表 -->
                      <div>
                          <div class="grid grid-cols-4 gap-2 mb-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">
                              <div>活跃英雄</div>
                              <div class="text-center">时长</div>
                              <div class="text-center">KDA</div>
                              <div class="text-right" title="每10分钟伤害 / 每10分钟治疗。主输出看伤害，主奶看治疗。">
                                  <span class="cursor-help border-b border-dotted border-slate-500">伤/疗 (10m) ❓</span>
                              </div>
                          </div>
                          <div class="flex flex-col">
                              ${heroesHtml || '<p class="text-xs text-slate-500 py-2">近期无有效英雄数据</p>'}
                          </div>
                      </div>
                  </article>
              `;
          });
      }

      async function forceSync() {
          const btn = document.getElementById("refreshBtn");
          btn.innerHTML = "抓取中...";
          btn.disabled = true;
          try {
              await fetch('/api/snapshot/team/all', { method: 'POST' });
              alert("拉取成功！请等待明天系统产生第二条快照后，即可看到 Delta 差值分析。");
              loadReport();
          } catch(e) {
              alert("拉取失败，请检查网络");
          } finally {
              btn.innerHTML = "强制拉取快照";
              btn.disabled = false;
          }
      }

      loadReport();
    </script>
</body>
</html>
