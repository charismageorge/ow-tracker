<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OW Team Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ow: {
                orange: "#f99e1a",
                ink: "#0b0e14",
                panel: "#141821",
              },
            },
            fontFamily: {
              sans: ["Inter", "Segoe UI", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-ow-ink text-slate-100 antialiased">
    <!-- 背景光晕 -->
    <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(249,158,26,0.12),_transparent_55%)]"></div>


    <main class="relative mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
      <header class="mb-8 flex flex-col sm:flex-row items-start sm:items-end justify-between gap-4">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.25em] text-ow-orange">Overwatch Tracker</p>
          <h1 class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">Team Dashboard</h1>
          <p class="mt-1 text-sm text-slate-400">实时追踪车队战力数据</p>
        </div>
        <button id="refreshBtn" onclick="refreshTeamData()" class="flex items-center gap-2 rounded-lg bg-ow-orange px-5 py-2.5 text-sm font-bold text-ow-ink transition-all hover:bg-orange-400 disabled:opacity-50">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span id="refreshText">拉取最新数据</span>
        </button>
      </header>


      <!-- 队伍数据展示网格 -->
      <section id="team-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        <!-- Loading 骨架屏 -->
        <div id="loading" class="col-span-full flex flex-col items-center justify-center gap-4 py-16">
          <div class="h-12 w-12 animate-spin rounded-full border-2 border-white/10 border-t-ow-orange"></div>
          <p class="text-sm font-medium tracking-wide text-slate-400">Loading team snapshots…</p>
        </div>
      </section>


      <!-- 错误提示 -->
      <div id="error" class="hidden py-12 text-center col-span-full">
        <p class="text-lg font-semibold text-rose-300">Could not load team data</p>
        <p id="error-message" class="mt-2 text-sm text-slate-400"></p>
      </div>
    </main>


    <script>
      const ROLE_ORDER = ["tank", "damage", "support", "open"];


      function capitalize(value) {
        if (!value) return "";
        return value.charAt(0).toUpperCase() + value.slice(1);
      }


      // 获取竞技段位数据
      function getCompetitiveRanks(summary) {
        const competitive = summary.competitive || {};
        return competitive.pc || competitive.console || null;
      }


      // 获取前三名最常玩英雄
      // 获取前三名最常玩英雄（修复版）
      function getTopHeroes(stats) {
        if (!stats || !stats.heroes) return [];
        
        const heroesObj = stats.heroes;
        const heroArray = [];
        
        // 将嵌套的对象转换为数组
        for (const [heroName, heroData] of Object.entries(heroesObj)) {
          if (heroData && heroData.time_played > 0) {
            heroArray.push({
              hero: heroName,
              value: heroData.time_played,
              winrate: heroData.winrate // 顺便把胜率也拿了
            });
          }
        }
        
        // 按游玩时长从大到小排序
        heroArray.sort((a, b) => b.value - a.value);
        
        // 返回前三名
        return heroArray.slice(0, 3);
      }




      // 渲染单张玩家卡片
      function createPlayerCard(player) {
        if (!player.found) {
          return `
            <div class="rounded-3xl border border-white/10 bg-ow-panel/50 p-6 flex items-center justify-center text-slate-500">
              暂无 ${player.battle_tag} 的快照数据
            </div>
          `;
        }


        const summary = player.summary || {};
        const stats = player.stats || {};
        const compRanks = getCompetitiveRanks(summary);
        const topHeroes = getTopHeroes(stats);


        // 构建段位 HTML
        let ranksHtml = '';
        if (!compRanks) {
          ranksHtml = '<p class="text-xs text-slate-500">Unranked / Private</p>';
        } else {
          ROLE_ORDER.forEach(role => {
            const data = compRanks[role];
            if (data) {
              ranksHtml += `
                <div class="flex flex-col items-center justify-center p-2 rounded-xl bg-white/5 border border-white/5">
                  <div class="flex items-center gap-1 mb-1">
                    ${data.role_icon ? `<img src="${data.role_icon}" class="h-3 w-3 opacity-70">` : ''}
                    <span class="text-[10px] uppercase text-slate-400">${role}</span>
                  </div>
                  <img src="${data.rank_icon}" class="h-8 w-8 object-contain mb-1">
                  <span class="text-xs font-bold">${capitalize(data.division)} ${data.tier ?? ''}</span>
                </div>
              `;
            }
          });
        }


       // 构建英雄 HTML（修复版）
        let heroesHtml = '<p class="text-xs text-slate-500 mt-2">No hero stats available</p>';
        if (topHeroes.length > 0) {
          heroesHtml = topHeroes.map(h => {
            const hours = (h.value / 3600).toFixed(1);
            return `
              <div class="flex justify-between items-center py-1.5 border-b border-white/5 last:border-0">
                <span class="text-sm font-medium capitalize text-slate-200">${h.hero}</span>
                <div class="flex items-center gap-3">
                  <span class="text-[10px] text-slate-400">Win ${h.winrate}%</span>
                  <span class="text-xs text-ow-orange">${hours} h</span>
                </div>
              </div>
            `;
          }).join('');
        }




        return `
          <article class="flex flex-col rounded-3xl border border-white/10 bg-ow-panel/80 p-6 shadow-2xl shadow-black/40 backdrop-blur transition-all hover:border-ow-orange/50">
            <!-- 头部：头像与名称 -->
            <div class="flex items-start gap-4 mb-6">
              <img src="${summary.avatar || ''}" class="h-16 w-16 rounded-xl border border-white/10 object-cover shadow-lg bg-black/50" />
              <div class="flex-1">
                <h2 class="text-xl font-bold">${summary.username || player.battle_tag}</h2>
                <p class="text-xs text-ow-orange mb-2">${summary.title || ''}</p>
                <div class="inline-flex items-center gap-1.5 rounded-full bg-white/5 px-2 py-0.5 text-[10px]">
                  <span class="text-slate-400">Endorsement</span>
                  <span class="font-semibold">${summary.endorsement?.level || '?'}</span>
                </div>
              </div>
            </div>


            <!-- 中部：竞技段位 -->
            <div class="mb-6">
              <h3 class="mb-3 text-[10px] font-semibold uppercase tracking-widest text-slate-500">Competitive Ranks</h3>
              <div class="grid grid-cols-3 gap-2">
                ${ranksHtml}
              </div>
            </div>


            <!-- 底部：最常玩英雄 -->
            <div class="mt-auto pt-4 border-t border-white/10">
              <h3 class="mb-2 text-[10px] font-semibold uppercase tracking-widest text-slate-500">Top Heroes (Time Played)</h3>
              <div class="flex flex-col">
                ${heroesHtml}
              </div>
            </div>
          </article>
        `;
      }


      async function loadTeamData() {
        const grid = document.getElementById("team-grid");
        const loading = document.getElementById("loading");
        const errorEl = document.getElementById("error");


        try {
          const response = await fetch('/api/data/team/latest');
          if (!response.ok) throw new Error("Failed to fetch team data");
          const team = await response.json();
          
          loading.classList.add("hidden");
          errorEl.classList.add("hidden");
          
          grid.innerHTML = team.map(player => createPlayerCard(player)).join('');
        } catch (error) {
          loading.classList.add("hidden");
          errorEl.classList.remove("hidden");
          document.getElementById("error-message").textContent = error.message;
        }
      }


      async function refreshTeamData() {
        const btn = document.getElementById("refreshBtn");
        const text = document.getElementById("refreshText");
        
        btn.disabled = true;
        text.textContent = "正在抓取...";
        btn.classList.add("animate-pulse");


        try {
          // 调用 main.py 中已经写好的批量更新接口
          await fetch('/api/snapshot/team/all', { method: 'POST' });
          await loadTeamData();
        } catch (error) {
          alert("刷新失败，请查看控制台日志");
        } finally {
          btn.disabled = false;
          text.textContent = "拉取最新数据";
          btn.classList.remove("animate-pulse");
        }
      }


      // 初始化加载
      loadTeamData();
    </script>
  </body>
</html>
